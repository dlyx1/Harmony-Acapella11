
name: Build Harmony Acapella APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q Harmony_Acapella_GitHub_Project.zip -d source
          cp -R source/. .

      - name: Fix JVM target compatibility
        run: |
          python3 -c "p='app/build.gradle.kts';s=open(p).read();s=s.replace('    compileSdk = 35','    compileSdk = 35\n    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = \"17\" }');open(p,'w').write(s)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Acapella-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
